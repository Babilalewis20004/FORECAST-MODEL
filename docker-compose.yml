services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # backend/.env must exist (copy backend/.env.example -> backend/.env)
    # before `docker compose up` -- compose fails to start otherwise.
    env_file:
      - backend/.env
    environment:
      # The database lives in a native Postgres install on the host, not a
      # container -- a Docker-managed named volume was found to not survive
      # a Docker Desktop restart (its internal WSL2 storage got reset),
      # while this host install is completely outside Docker's lifecycle.
      # host.docker.internal is Docker Desktop's DNS name for the host
      # machine, reachable from any container without extra config.
      DATABASE_URL: postgresql+psycopg2://predict:predict@host.docker.internal:5432/predict_model
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      # Trained models and the out-of-sample prediction cache are large,
      # slow to rebuild, and gitignored -- mounted rather than baked into
      # the image so they persist across rebuilds.
      - ./backend/app/ml/model_store:/app/backend/app/ml/model_store
      - ./downloaded_files:/app/downloaded_files

  dashboard:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://predict:predict@host.docker.internal:5432/predict_model
    ports:
      - "8501:8501"
    volumes:
      - ./backend/app/ml/model_store:/app/backend/app/ml/model_store
      - ./downloaded_files:/app/downloaded_files

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      # Points the dev-server proxy at the backend container instead of the
      # frontend container's own localhost (see vite.config.ts).
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
